name: Deploy Panacea Full-Stack Platform

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  AZURE_RESOURCE_GROUP: rg-penancias-dev
  AZURE_LOCATION: uaenorth
  ACR_NAME: acrpenancias
  CONTAINER_APP_ENV: cae-penancias
  API_CONTAINER_APP: penancias-api
  WORKFLOW_CONTAINER_APP: penancias-workflow
  WEB_CONTAINER_APP: penancias-web
  GOTENBERG_CONTAINER_APP: penancias-pdf
  STATIC_WEB_APP_NAME: icy-sea-01859df0f

jobs:
  # ============================================================
  # 0. CHANGELOG Enforcement
  # ============================================================
  check_changelog:
    runs-on: ubuntu-latest
    name: Enforce CHANGELOG Entry
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CHANGELOG check
        run: bash tools/check_changelog.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # ============================================================
  # 1. Build & Test Backend (.NET)
  # ============================================================
  build_test_backend:
    runs-on: ubuntu-latest
    name: Build & Test Backend (.NET)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Penancia.S.sln

      - name: Build solution
        run: dotnet build Penancia.S.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test tests/Penancia.S.Tests/Penancia.S.Tests.csproj --no-build -c Release --verbosity normal

  # ============================================================
  # 2. Build & Test Frontend
  # ============================================================
  build_test_frontend:
    runs-on: ubuntu-latest
    name: Build & Test Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck Frontend
        working-directory: frontend
        run: bun run lint

      - name: Run Frontend Tests
        working-directory: frontend
        run: bun test

      - name: Build Frontend Production Artifacts
        working-directory: frontend
        run: bun run build

  # ============================================================
  # 3. Deploy Frontend to Azure Static Web Apps
  # ============================================================
  deploy_frontend:
    needs: build_test_frontend
    runs-on: ubuntu-latest
    name: Deploy Frontend to Azure Static Web Apps
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile || bun install

      - name: Build Frontend Production Artifacts
        working-directory: frontend
        run: bun run build

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          output_location: "dist"

  # ============================================================
  # 4. Close Pull Request Job
  # ============================================================
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close SWA Environment
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"