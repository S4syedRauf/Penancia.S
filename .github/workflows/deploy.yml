name: Deploy Panacea Full-Stack Platform

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_test_backend:
    runs-on: ubuntu-latest
    name: Build & Test Backend (.NET)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Penancia.S.sln

      - name: Build solution
        run: dotnet build Penancia.S.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test tests/Penancia.S.Tests/Penancia.S.Tests.csproj --no-build -c Release --verbosity normal

  build_test_frontend:
    runs-on: ubuntu-latest
    name: Build & Test Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck Frontend
        working-directory: frontend
        run: bun run lint

      - name: Run Frontend Tests
        working-directory: frontend
        run: bun test

      - name: Build Frontend Production Artifacts
        working-directory: frontend
        run: bun run build