<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%" style="background:#0a0e1a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#10172a"/>
    </linearGradient>
    <linearGradient id="azureBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>
    
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#00F5D4"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#0078D4"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#F5A623"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad2)"/>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="1280" height="70" rx="10" fill="#151E34" stroke="#233554" stroke-width="1.5"/>
    <text x="30" y="32" fill="#FFFFFF" font-size="18" font-weight="700">Microsoft Foundry — End-to-End Execution &amp; Tool-Calling Lifecycle</text>
    <text x="30" y="52" fill="#94A3B8" font-size="12">Sequence diagram showing how a mobile/web user prompt executes through the BFF API, Responses API (Agents v2), and Toolbox</text>
  </g>

  <!-- Lifeline Columns -->
  <!-- Col 1: Client App -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#1E293B" stroke="#0284C7"/>
    <text x="80" y="25" fill="#38BDF8" font-size="12" font-weight="700" text-anchor="middle">Mobile / Web Client</text>
    <line x1="80" y1="40" x2="80" y2="680" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- Col 2: Backend BFF API -->
  <g transform="translate(380, 140)">
    <rect x="0" y="0" width="180" height="40" rx="6" fill="#1E293B" stroke="#F5A623"/>
    <text x="90" y="25" fill="#F5A623" font-size="12" font-weight="700" text-anchor="middle">Backend API (BFF / APIM)</text>
    <line x1="90" y1="40" x2="90" y2="680" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- Col 3: Foundry Agent Service -->
  <g transform="translate(680, 140)">
    <rect x="0" y="0" width="200" height="40" rx="6" fill="#1E293B" stroke="#0078D4"/>
    <text x="100" y="25" fill="#0078D4" font-size="12" font-weight="700" text-anchor="middle">Foundry Agent Service (v2)</text>
    <line x1="100" y1="40" x2="100" y2="680" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- Col 4: Foundry Toolbox / External Tool -->
  <g transform="translate(1000, 140)">
    <rect x="0" y="0" width="200" height="40" rx="6" fill="#1E293B" stroke="#00F5D4"/>
    <text x="100" y="25" fill="#00F5D4" font-size="12" font-weight="700" text-anchor="middle">Tools / MCP / DB / n8n</text>
    <line x1="100" y1="40" x2="100" y2="680" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- Sequence Steps -->
  <!-- Step 1: User sends message -->
  <g transform="translate(0, 210)">
    <line x1="180" y1="20" x2="470" y2="20" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrCyan)"/>
    <rect x="220" y="5" width="210" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="325" y="20" fill="#CBD5E1" font-size="10" text-anchor="middle">1. POST /api/chat {msg, convId}</text>
  </g>

  <!-- Step 2: BFF checks ownership & authenticates with Entra ID -->
  <g transform="translate(0, 260)">
    <rect x="470" y="10" width="18" height="40" rx="2" fill="#F5A623"/>
    <rect x="500" y="15" width="170" height="30" rx="4" fill="#1E293B" stroke="#334155"/>
    <text x="510" y="28" fill="#F5A623" font-size="9" font-weight="700">2. Validate User &amp; ConvId</text>
    <text x="510" y="40" fill="#94A3B8" font-size="8">Acquire Entra Managed Token</text>
  </g>

  <!-- Step 3: BFF calls Responses API -->
  <g transform="translate(0, 320)">
    <line x1="470" y1="20" x2="780" y2="20" stroke="#0078D4" stroke-width="2" marker-end="url(#arrBlue)"/>
    <rect x="510" y="5" width="230" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="625" y="20" fill="#38BDF8" font-size="10" text-anchor="middle">3. openai.responses.create(convId, input)</text>
  </g>

  <!-- Step 4: Model decides tool call -->
  <g transform="translate(0, 370)">
    <line x1="780" y1="20" x2="470" y2="20" stroke="#F5A623" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrAmber)"/>
    <rect x="520" y="5" width="210" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="625" y="20" fill="#F5A623" font-size="9" text-anchor="middle">4. response.output: [function_call_item]</text>
  </g>

  <!-- Step 5: BFF executes tool (e.g. SQL / n8n / MCP) -->
  <g transform="translate(0, 420)">
    <line x1="470" y1="20" x2="1100" y2="20" stroke="#00F5D4" stroke-width="2" marker-end="url(#arrCyan)"/>
    <rect x="710" y="5" width="220" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="820" y="20" fill="#00F5D4" font-size="9" text-anchor="middle">5. Execute Tool (e.g. POST to n8n webhook)</text>
  </g>

  <!-- Step 6: Tool returns data -->
  <g transform="translate(0, 470)">
    <line x1="1100" y1="20" x2="470" y2="20" stroke="#00F5D4" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrCyan)"/>
    <rect x="720" y="5" width="200" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="820" y="20" fill="#94A3B8" font-size="9" text-anchor="middle">6. Return JSON Tool Result</text>
  </g>

  <!-- Step 7: BFF submits tool outputs back to Foundry -->
  <g transform="translate(0, 520)">
    <line x1="470" y1="20" x2="780" y2="20" stroke="#0078D4" stroke-width="2" marker-end="url(#arrBlue)"/>
    <rect x="520" y="5" width="210" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="625" y="20" fill="#38BDF8" font-size="9" text-anchor="middle">7. Submit tool_output to Responses API</text>
  </g>

  <!-- Step 8: Foundry streams synthesized response -->
  <g transform="translate(0, 570)">
    <line x1="780" y1="20" x2="470" y2="20" stroke="#00F5D4" stroke-width="2" marker-end="url(#arrCyan)"/>
    <rect x="530" y="5" width="190" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="625" y="20" fill="#00F5D4" font-size="9" text-anchor="middle">8. Stream Final Token Chunks</text>
  </g>

  <!-- Step 9: BFF forwards SSE stream to Client -->
  <g transform="translate(0, 620)">
    <line x1="470" y1="20" x2="180" y2="20" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrCyan)"/>
    <rect x="230" y="5" width="190" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
    <text x="325" y="20" fill="#38BDF8" font-size="9" text-anchor="middle">9. Server-Sent Events (SSE) Stream</text>
  </g>

  <!-- Summary Box at bottom -->
  <g transform="translate(60, 740)">
    <rect x="0" y="0" width="1280" height="120" rx="10" fill="#151E34" stroke="#233554" stroke-width="1"/>
    <text x="25" y="30" fill="#00F5D4" font-size="12" font-weight="700">Key Architectural Invariants Enforced in this Sequence:</text>
    <text x="25" y="52" fill="#CBD5E1" font-size="11">• <tspan font-weight="700" fill="#FFFFFF">Strict Separation of Credentials:</tspan> The mobile client NEVER connects to Foundry directly; it receives only filtered SSE token text from your BFF.</text>
    <text x="25" y="70" fill="#CBD5E1" font-size="11">• <tspan font-weight="700" fill="#FFFFFF">Conversation Isolation:</tspan> Conversation IDs are mapped to authenticated user records in the backend database to prevent unauthorized access across tenants.</text>
    <text x="25" y="88" fill="#CBD5E1" font-size="11">• <tspan font-weight="700" fill="#FFFFFF">Deterministic Tool Resolution:</tspan> External systems like n8n or relational databases are called server-side by the BFF, avoiding exposed webhooks.</text>
    <text x="25" y="106" fill="#94A3B8" font-size="10">• Tracing: Distributed OpenTelemetry spans are automatically emitted to Application Insights across Steps 3, 5, 7, and 8.</text>
  </g>
</svg>
